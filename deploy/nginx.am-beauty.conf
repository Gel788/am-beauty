# Production nginx for AM Beauty (VPS + PM2 standalone)
# Path on server: /etc/nginx/sites-available/am-beauty

server {
    listen 80;
    listen [::]:80;
    server_name ambeauty-cosmetica.ru www.ambeauty-cosmetica.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ambeauty-cosmetica.ru www.ambeauty-cosmetica.ru;

    ssl_certificate /etc/letsencrypt/live/ambeauty-cosmetica.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambeauty-cosmetica.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    root /var/www/am-beauty/.next/standalone;

    # Next.js static chunks — напрямую с диска, правильный MIME
    location /_next/static/ {
        alias /var/www/am-beauty/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Публичные файлы и загрузки CMS
    location /uploads/ {
        alias /var/www/am-beauty/public/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location /images/ {
        alias /var/www/am-beauty/.next/standalone/public/images/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /videos/ {
        alias /var/www/am-beauty/.next/standalone/public/videos/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
