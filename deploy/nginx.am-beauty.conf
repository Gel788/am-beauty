# Production nginx for AM Beauty (VPS + PM2 next start)
# Path on server: /etc/nginx/sites-available/am-beauty

server {
    listen 80;
    listen [::]:80;
    server_name ambeauty-cosmetica.ru www.ambeauty-cosmetica.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ambeauty-cosmetica.ru www.ambeauty-cosmetica.ru;

    ssl_certificate /etc/letsencrypt/live/ambeauty-cosmetica.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambeauty-cosmetica.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # Next.js static chunks — из корневого .next/static (не standalone)
    location /_next/static/ {
        alias /var/www/am-beauty/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /uploads/ {
        alias /var/www/am-beauty/public/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov MOV;
        }
        default_type application/octet-stream;
        access_log off;
        try_files $uri =404;
    }

    location /images/ {
        alias /var/www/am-beauty/public/images/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /videos/ {
        alias /var/www/am-beauty/public/videos/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
        types {
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov MOV;
        }
        default_type application/octet-stream;
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store" always;
    }
}
