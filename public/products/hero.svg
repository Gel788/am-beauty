    <text x="128" y="632" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#3D3228" letter-spacing="4">AM BEAUTY</text>
    <text x="128" y="648" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#6B5D50" letter-spacing="2">BAKUCHIOL NIGHT</text>
